server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://localhost:1433;databaseName=LifeCircleDB;encrypt=false
    username: sa
    password: 123456

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# AI 大模型中转配置（生产环境建议通过环境变量注入，勿硬编码到前端）
# ai.url 为空时，POST /api/ai/chat 返回友好提示，前端可改用规则版 /api/ai/advice
ai:
  url: ""        # 大模型 API 地址，例如 https://api.openai.com/v1/chat/completions
  api-key: ""    # 大模型 API Key（服务端保管）
  model: ""      # 模型名称，例如 gpt-4o-mini
