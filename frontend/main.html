<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统主页 · 张店区15分钟生活圈</title>
<link rel="stylesheet" href="css/common.css">
<style>
    body { overflow: hidden; }
    #map { position: fixed; top:56px; left:0; right:0; bottom:0; }
 
    /* 左侧分析面板 */
    .left-panel {
        position: fixed; top:72px; left:14px; width:286px; max-height: calc(100vh - 90px);
        overflow-y:auto; padding:18px; z-index:900;
    }
    .left-panel h3 { font-size:15px; margin-bottom:12px; color:#0e6f9f; }
    .sec { margin-bottom:14px; }
    .sec-t { font-size:13px; color:#46566a; margin-bottom:6px; font-weight:600; }
    .opt-row { display:flex; gap:6px; flex-wrap:wrap; }
    .chip {
        padding:5px 11px; border-radius:14px; font-size:12px; cursor:pointer;
        background:rgba(255,255,255,.7); border:1px solid rgba(120,160,190,.35);
    }
    .chip.on { background:linear-gradient(90deg,#1676d6,#2ec4b6); color:#fff; border-color:transparent; }
    .ck-item { font-size:13px; margin:4px 0; color:#33475b; display:flex; align-items:center; gap:6px; }
    .slider-row { display:flex; align-items:center; gap:8px; font-size:12px; color:#46566a; margin:4px 0; }
    .slider-row input[type=range] { flex:1; }
    .num { font-variant-numeric:tabular-nums; color:#0e6f9f; font-weight:600; }
 
    /* 右侧结果面板 */
    .right-panel {
        position: fixed; top:72px; right:14px; width:330px; max-height: calc(100vh - 90px);
        overflow-y:auto; padding:18px; z-index:900;
    }
    .kpi-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
    .kpi {
        background:rgba(46,196,182,.1); border-radius:12px; padding:10px;
    }
    .kpi .v { font-size:20px; font-weight:700; color:#0e6f9f; }
    .kpi .l { font-size:11px; color:#6b7a8d; }
    .result-list { list-style:none; }
    .result-list li {
        padding:9px 10px; border-radius:10px; cursor:pointer; margin-bottom:6px;
        background:rgba(255,255,255,.6); font-size:13px; border:1px solid rgba(120,160,190,.15);
    }
    .result-list li:hover { background:rgba(46,196,182,.12); }
    .result-list .sub { font-size:11px; color:#8aa; margin-top:2px; }
 
    /* 右上角工具组 */
    .map-tools {
        position:fixed; top:72px; right:14px; z-index:950; display:flex; gap:8px;
    }
    .map-tools button {
        padding:8px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.6);
        background:rgba(255,255,255,.75); backdrop-filter:blur(10px); cursor:pointer; font-size:13px;
        box-shadow:0 4px 14px rgba(0,0,0,.1);
    }
    .map-tools button.on { background:linear-gradient(90deg,#1676d6,#2ec4b6); color:#fff; }
 
    /* 底部工具条 */
    .bottom-bar {
        position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:950;
        display:flex; gap:8px; padding:8px 12px; border-radius:18px;
    }
    .bottom-bar button {
        border:none; width:42px; height:42px; border-radius:50%; cursor:pointer; font-size:18px;
        background:rgba(255,255,255,.85); box-shadow:0 4px 12px rgba(0,0,0,.12);
    }
    .bottom-bar button:hover { background:#2ec4b6; color:#fff; }
 
    /* 弹窗内容 */
    .detail-row { display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px dashed rgba(120,160,190,.2); }
    .detail-row b { color:#0e6f9f; }
    .eval-item { background:rgba(46,196,182,.07); border-radius:10px; padding:9px; margin:7px 0; font-size:13px; }
    .star { color:#faad14; }
    .fav-star { cursor:pointer; font-size:18px; }
    .empty { text-align:center; color:#99a; font-size:13px; padding:20px 0; }
</style>
</head>
<body>
<!-- 顶部导航 -->
<div class="topbar">
    <div class="brand">🏙 张店区15分钟生活圈</div>
    <div class="menu">
        <a href="main.html" class="active">地图主页</a>
        <a href="dashboard.html">图表可视化</a>
        <a href="javascript:openFav()">我的收藏</a>
        <a href="javascript:savePlan()">保存方案</a>
        <a href="admin.html" id="adminMenu" style="display:none">数据管理</a>
    </div>
    <div class="search-box">
        <input id="kw" placeholder="全局搜索小区/设施名称" onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btn btn-sm" onclick="doSearch()">搜索</button>
    </div>
    <div class="user-area">
        <div class="avatar" id="avatar">U</div>
        <span id="userName"></span>
        <button class="btn btn-ghost btn-sm" onclick="logout()">退出</button>
    </div>
</div>
 
<!-- 地图画布 -->
<div id="map"></div>
 
<!-- 右上角：图层模式 / 底图切换 -->
<div class="map-tools">
    <button id="modeScatter" class="on" onclick="setRenderMode('scatter')">散点模式</button>
    <button id="modeHeat" onclick="setRenderMode('heat')">热力模式</button>
    <button id="baseVector" class="on" onclick="switchBase('vector')">标准图</button>
    <button id="baseSat" onclick="switchBase('sat')">卫星图</button>
</div>
 
<!-- 左侧：可达性分析面板 -->
<div class="left-panel glass">
    <h3>📐 15分钟可达性分析</h3>
    <div class="sec">
        <div class="sec-t">分析起点</div>
        <div class="opt-row">
            <div class="chip on" id="modePoint" onclick="setStartMode('point')">地图任意点</div>
            <div class="chip" id="modeCommunity" onclick="setStartMode('community')">小区点位</div>
        </div>
    </div>
    <div class="sec">
        <div class="sec-t">步行时间（分钟）</div>
        <div class="opt-row" id="timeOpts">
            <div class="chip" data-t="5">5</div>
            <div class="chip" data-t="10">10</div>
            <div class="chip on" data-t="15">15</div>
            <div class="chip" data-t="20">20</div>
            <div class="chip" data-t="30">30</div>
        </div>
    </div>
    <div class="sec slider-row">
        <span>步行速度</span>
        <input type="range" id="speed" min="40" max="120" value="80">
        <span class="num"><span id="speedV">80</span> m/min</span>
    </div>
    <div class="sec">
        <div class="sec-t">目标设施分类（可多选）</div>
        <div id="catBox"></div>
    </div>
    <div class="sec">
        <div class="sec-t">房价区间（元/㎡）</div>
        <div class="slider-row"><input type="range" id="priceMin" min="0" max="20000" step="500" value="0"><span class="num" id="priceMinV">0</span></div>
        <div class="slider-row"><input type="range" id="priceMax" min="0" max="20000" step="500" value="20000"><span class="num" id="priceMaxV">20000</span></div>
    </div>
    <div class="sec">
        <div class="sec-t">综合评估权重</div>
        <div class="slider-row">房价<input type="range" id="wPrice" min="0" max="100" value="30"><span class="num" id="wPriceV">30</span>%</div>
        <div class="slider-row">可达性<input type="range" id="wAcc" min="0" max="100" value="40"><span class="num" id="wAccV">40</span>%</div>
        <div class="slider-row">评价<input type="range" id="wEva" min="0" max="100" value="30"><span class="num" id="wEvaV">30</span>%</div>
    </div>
    <button class="btn" style="width:100%" onclick="runAnalysis()">开始可达性分析</button>
    <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="clearAll()">清除结果</button>
</div>
 
<!-- 右侧：结果统计面板 -->
<div class="right-panel glass">
    <h3 style="font-size:15px;color:#0e6f9f;margin-bottom:12px">📊 分析结果</h3>
    <div class="kpi-grid">
        <div class="kpi"><div class="v" id="kpiFac">0</div><div class="l">可达设施</div></div>
        <div class="kpi"><div class="v" id="kpiCom">0</div><div class="l">周边小区</div></div>
        <div class="kpi"><div class="v" id="kpiScore">--</div><div class="l">综合评分</div></div>
        <div class="kpi"><div class="v" id="kpiAvg">--</div><div class="l">平均房价</div></div>
    </div>
    <div class="sec-t">可达设施清单（点击定位）</div>
    <ul class="result-list" id="facList"><li class="empty">尚未分析</li></ul>
    <div class="sec-t" style="margin-top:10px">周边小区推荐（按综合分）</div>
    <ul class="result-list" id="comList"><li class="empty">尚未分析</li></ul>
    <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:10px" onclick="exportAnalysis()">导出本次分析结果Excel</button>
</div>
 
<!-- 底部工具条 -->
<div class="bottom-bar glass">
    <button title="复位视图" onclick="resetView()">⌂</button>
    <button title="框选查询" onclick="toggleBox()">▢</button>
    <button title="测距" onclick="measure()">📏</button>
    <button title="清除绘制" onclick="clearAll()">✕</button>
</div>
 
<!-- 通用弹窗容器 -->
<div class="modal-mask" id="modalMask">
    <div class="modal glass" id="modalBox" style="position:relative">
        <span class="close" onclick="closeModal()">×</span>
        <div id="modalBody"></div>
    </div>
</div>
 
<div class="loading" id="loading"><div class="spin"></div></div>
 
<!-- 高德地图 JS API 2.0：把下面两个占位换成你申请的 Key 与安全密钥 -->
<script>window._AMapSecurityConfig = { securityJsCode:'d5bf0f930e7b55dadcd35863d958c5f3' };</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=698dfb27413eb152a809a7a13009488f&plugin=AMap.MarkerCluster,AMap.HeatMap,AMap.MouseTool,AMap.ToolBar,AMap.Scale"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
