<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活圈便民设施评价与管理系统</title>
    <style>
        * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  
}

body {
  width: 100vw;
  min-height: 100vh;
  overflow: hidden;
  background-color: #fefde9;
}

        /* 文字淡入动画 */
        .text-center {
            position: fixed;
            bottom: 80%;
            right: 15%;
            z-index: 9;
            text-align: center;
            color: #2F3837;
            font-size: 30px;
            font-family: "Microsoft YaHei", sans-serif;
            
            /* 文字淡入 */
            opacity: 0;
            animation: textFade 1.0s ease forwards;
            animation-delay: 1.0s;
        }
        
        @keyframes textFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /*登录*/
        .login-box {
  position: absolute;
  top: 50%;
  left: 80%;
  transform: translate(-50%, -50%);
  width: 360px;
  padding: 40px 30px;
  background: rgba(255, 255, 255, 1);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 0;
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  z-index: 9;
}

.login-box h2 {
  text-align: center;
  margin-bottom: 30px;
  color: #2d2a27;
  font-weight: normal;
}

.input-item {
  margin-bottom: 20px;
}

.input-item input {
  width: 100%;
  padding: 14px 18px;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 0px;
  outline: none;
  font-size: 16px;
  color: #333;
  backdrop-filter: blur(4px);
}

.input-item input::placeholder {
  color: #666;
}

.login-btn {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  background: #1676d6;
  color: white;
  border: none;
  border-radius: 0px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

.login-btn:hover {
  background: #ff7a1b;
}

/*插图*/
.logo {
  position: absolute;
  top: 50%;
  left: 40%;
  transform: translate(-50%, -50%);
  z-index: 1;
  width: 100%; /* 控制大小 */
  opacity: 0;
  animation: fadeIn 1.0s ease forwards;
  animation-delay: 1.0s;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
    
</head>

<body>
    <!-- 中间下方文字 -->
<div class="text-center">
    <p>生活圈便民设施<br>评价与管理系统
  
</div>

<img class="logo" src="登录页面插图.png" alt="LOGO">

<div class="login-box">
  <h2>用户登录</h2>

  <div class="input-item">
    <input type="text" id="username" placeholder="请输入用户名">
  </div>

  <div class="input-item">
    <input type="password" id="password" placeholder="请输入密码">
  </div>

  <button class="login-btn" onclick="login()">登录</button>
</div>

<script>
function login() {
  let user = document.getElementById('username').value.trim();
  let pwd = document.getElementById('password').value.trim();

  // 账号1
  if (user === '1' && pwd === '123') {
    window.location.href = '前端GIS开发.html';
  }
  // 错误
  else {
    alert('账号或密码错误');
  }
}
</script>
</body>
</html>
