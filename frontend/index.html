<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活圈便民设施评价与管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            min-height: 100vh;
            background-image: url("登录页面插图.png");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
        }
        /* 标题淡入动画 */
        .text-center {
            position: absolute;
            top: 12%;
            right: 15%;
            transform: translateX(-50%);
            z-index: 9;
            text-align: center;
            color: #2F3837;
            font-size: 30px;
            font-family: "Microsoft YaHei", sans-serif;
            opacity: 0;
            animation: textFade 1.0s ease forwards;
            animation-delay: 1.0s;
        }
        @keyframes textFade {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        /*登录盒子*/
        .login-box {
            position: absolute;
            top: 50%;
            left: 70%;
            transform: translate(-50%, -50%);
            width: 360px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 0;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            z-index: 9;
            opacity: 0;
            animation: boxFade 1.0s ease forwards;
            animation-delay: 1.0s;
        }
        /* 登录框单独动画 */
        @keyframes boxFade {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #2d2a27;
            font-weight: normal;
        }
        .input-item {
            margin-bottom: 20px;
        }
        .input-item input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 0px;
            outline: none;
            font-size: 16px;
            color: #333;
            backdrop-filter: blur(4px);
        }
        .input-item input::placeholder {
            color: #666;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: #1676d6;
            color: white;
            border: none;
            border-radius: 0px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover {
            background: #ff7a1b;
        }
        /*插图logo*/
        .logo {
            position: absolute;
            top: 50%;
            left: 30%;
            transform: translate(-50%, -50%);
            z-index: 1;
            width: 420px;
            max-width: 90%;
            opacity: 0;
            animation: fadeIn 1.0s ease forwards;
            animation-delay: 1.0s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .reg-link{
            color:#409eff;
            cursor:pointer;
        }
        .reg-link:hover{
            text-decoration:underline;
        }
    </style>

</head>
<body>
    <!-- 标题 -->
    <div class="text-center">
        <p>生活圈便民设施<br>评价与管理系统</p>
    </div>
    <div class="login-box">
        <h2>用户登录</h2>
        <div class="input-item">
            <input type="text" id="username" placeholder="请输入用户名">
        </div>
        <div class="input-item">
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        <button class="login-btn" onclick="login()">登录</button>
        <div style="margin-top: 15px;text-align:center;">
            还没有账号？<a href="register.html" style="color: #1676d6;">立即注册</a>
        </div>
    </div>

<script>
function login() {
    let user = document.getElementById('username').value.trim();
    let pwd = document.getElementById('password').value.trim();
    // 测试账号
    if (user === '1' && pwd === '123') {
        window.location.href = '前端GIS.html';
    } else {
        alert('账号或密码错误');
    }
}
</script>
</body>
</html>
