<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>账号注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            padding: 30px;
        }
        /* 左上角标题区域 */
        .page-header {
            margin-bottom: 40px;
        }
        .system-title {
            font-size: 20px;
            font-weight: bold;
            color: #303133;
        }
        .line {
            width: 320px;
            height: 2px;
            background-color: #409eff;
            margin-top:8px;
        }
        /* 注册盒子，页面正中间 */
        .register-wrap {
            width: 420px;
            margin: 0 auto;
        }
        .register-box{
            padding:30px;
            border:1px solid #e4e7ed;
            border-radius:8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .register-box h2{
            text-align:center;
            margin-bottom:25px;
            color:#303133;
        }
        .item{
            margin-bottom:18px;
        }
        .item label{
            display:block;
            margin-bottom:6px;
            color:#606266;
        }
        .item input{
            width:100%;
            height:40px;
            padding:0 12px;
            border:1px solid #dcdfe6;
            border-radius:4px;
            font-size:14px;
        }
        .submit-btn{
            width:100%;
            height:42px;
            background:#409eff;
            color:white;
            border:none;
            border-radius:4px;
            font-size:15px;
            cursor:pointer;
        }
        .back-login{
            text-align:center;
            margin-top:20px;
        }
        .back-login a{
            color:#409eff;
            text-decoration:none;
        }
    </style>
</head>
<body>
    <!-- 左上角标题+横线 -->
    <div class="page-header">
        <div class="system-title">淄博市张店区15分钟生活圈便民设施评价与管理系统</div>
        <div class="line"></div>
    </div>

    <!-- 注册表单 页面正中间 -->
    <div class="register-wrap">
        <div class="register-box">
            <h2>账号注册</h2>
            <div class="item">
                <label>用户名</label>
                <input id="username" type="text" placeholder="请输入用户名">
            </div>
            <div class="item">
                <label>密码</label>
                <input id="pwd" type="password" placeholder="请输入密码">
            </div>
            <div class="item">
                <label>确认密码</label>
                <input id="repwd" type="password" placeholder="请再次输入密码">
            </div>
            <button class="submit-btn" onclick="doRegister()">提交注册</button>
            <div class="back-login">
                已有账号？<a href="main.html">返回登录</a>
            </div>
        </div>
    </div>

<script>
function doRegister(){
    // 获取输入框内容
    let username = document.getElementById('username').value.trim();
    let pwd = document.getElementById('pwd').value.trim();
    let repwd = document.getElementById('repwd').value.trim();

    // 判断不能为空
    if(username === ''){
        alert('请输入用户名');
        return;
    }
    if(pwd === ''){
        alert('请输入密码');
        return;
    }
    if(repwd === ''){
        alert('请输入确认密码');
        return;
    }
    // 判断两次密码是否一致
    if(pwd !== repwd){
        alert('两次输入的密码不一致，请重新输入！');
        return;
    }

    // 全部校验通过
    alert('前端校验通过！（暂无后端保存账号功能）');
    // 校验成功后可以跳回登录页
    window.location.href = "main.html";
}
</script>

</body>
</html>
