<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · 15分钟生活圈便民设施评价与管理系统</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        width:100vw; height:100vh;
        background: url("pic.png") center/cover no-repeat;
        font-family: "Microsoft YaHei", sans-serif;
        overflow: hidden;
    }
    /* 顶部系统标题（与登录页一致） */
    .sys-title {
        position:absolute; top:8%; left:50%; transform:translateX(-50%);
        text-align:center; color:#1f2d3d; z-index:9;
        animation: fade 1s ease;
        text-shadow:0 2px 18px rgba(255,255,255,.85);
    }
    .sys-title h1 {
        font-size:48px; letter-spacing:6px; font-weight:800;
        background:linear-gradient(90deg,#0e6f9f,#1676d6,#2ec4b6);
        -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .sys-title p { font-size:16px; color:#33475b; margin-top:12px; letter-spacing:1px; }
    @keyframes fade { from{opacity:0; transform:translateX(-50%) translateY(16px);} to{opacity:1;} }

    /* 注册卡片：玻璃拟态，与登录页同风格 */
    .register-card {
        position:absolute; top:50%; right:9%; transform:translateY(-50%);
        width:412px; padding:42px 38px;
        background: rgba(255,255,255,0.78);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border:1px solid rgba(255,255,255,0.65);
        border-radius:20px;
        box-shadow:0 12px 40px rgba(20,50,80,.18);
        animation: cardIn 1s ease;
    }
    @keyframes cardIn { from{opacity:0; transform:translateY(-42%);} to{opacity:1; transform:translateY(-50%);} }
    .register-card h2 { text-align:center; color:#1f2d3d; margin-bottom:28px; font-weight:700; font-size:22px; }
    .item { margin-bottom:18px; }
    .item label { display:block; font-size:13px; color:#46566a; margin-bottom:7px; }
    .item input {
        width:100%; padding:13px 15px; border:1px solid rgba(120,160,190,.4);
        border-radius:12px; font-size:15px; background:rgba(255,255,255,.75); outline:none;
    }
    .item input:focus { border-color:#2ec4b6; box-shadow:0 0 0 3px rgba(46,196,182,.18); }
    .submit-btn {
        width:100%; padding:15px; border:none; border-radius:12px; cursor:pointer;
        background:linear-gradient(90deg,#1676d6,#2ec4b6); color:#fff; font-size:17px;
        letter-spacing:8px; font-weight:600; transition:.25s;
    }
    .submit-btn:hover { box-shadow:0 8px 20px rgba(22,118,214,.4); transform:translateY(-1px); }
    .back-login { text-align:center; margin-top:18px; font-size:13px; color:#46566a; }
    .back-login a { color:#1676d6; text-decoration:none; }
</style>
</head>
<body>
    <div class="sys-title">
        <h1>张店区15分钟生活圈</h1>
        <p>便民设施评价与管理系统 · 账号注册</p>
    </div>

    <div class="register-card">
        <h2>用户注册</h2>
        <div class="item">
            <label>用户名</label>
            <input id="username" type="text" placeholder="请输入用户名">
        </div>
        <div class="item">
            <label>密码</label>
            <input id="pwd" type="password" placeholder="请输入密码">
        </div>
        <div class="item">
            <label>确认密码</label>
            <input id="repwd" type="password" placeholder="请再次输入密码">
        </div>
        <button class="submit-btn" onclick="doRegister()">注 册</button>
        <div class="back-login">已有账号？<a href="login.html">返回登录</a> · 登录注册已合并至登录页</div>
    </div>

<script src="js/config.js"></script>
<script>
// 注册：调用后端 POST /api/user/register，成功后跳转登录页
async function doRegister() {
    const username = document.getElementById('username').value.trim();
    const pwd = document.getElementById('pwd').value.trim();
    const repwd = document.getElementById('repwd').value.trim();

    if (!username) { toast('请输入用户名'); return; }
    if (!pwd) { toast('请输入密码'); return; }
    if (!repwd) { toast('请输入确认密码'); return; }
    if (pwd !== repwd) { toast('两次输入的密码不一致，请重新输入'); return; }

    try {
        const data = await api('/api/user/register', {
            method: 'POST',
            body: { username, password: pwd }
        });
        toast('注册成功，请登录');
        setTimeout(() => { location.href = 'login.html'; }, 800);
    } catch (e) { /* api 已 toast 错误 */ }
}
// 回车注册
document.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
</script>
</body>
</html>
