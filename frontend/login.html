<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 15分钟生活圈便民设施评价与管理系统</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    /* 登录背景直接使用项目自带的登录页面插图.png，全屏铺满 */
    body {
        width:100vw; height:100vh;
        background: url("登录页面插图.png") center/cover no-repeat;
        font-family: "Microsoft YaHei", sans-serif;
        overflow: hidden;
    }
    /* 顶部系统标题 */
    .sys-title {
        position:absolute; top:9%; left:50%; transform:translateX(-50%);
        text-align:center; color:#1f2d3d; z-index:9;
        animation: fade 1s ease;
    }
    .sys-title h1 { font-size:30px; letter-spacing:2px; }
    .sys-title p { font-size:14px; color:#46566a; margin-top:8px; }
    @keyframes fade { from{opacity:0; transform:translateX(-50%) translateY(16px);} to{opacity:1;} }
 
    /* 登录卡片：玻璃拟态 */
    .login-card {
        position:absolute; top:50%; right:14%; transform:translateY(-50%);
        width:360px; padding:38px 34px;
        background: rgba(255,255,255,0.72);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border:1px solid rgba(255,255,255,0.65);
        border-radius:20px;
        box-shadow:0 12px 40px rgba(20,50,80,.18);
        animation: cardIn 1s ease;
    }
    @keyframes cardIn { from{opacity:0; transform:translateY(-42%);} to{opacity:1; transform:translateY(-50%);} }
    .login-card h2 { text-align:center; color:#1f2d3d; margin-bottom:26px; font-weight:600; }
    .item { margin-bottom:16px; }
    .item label { display:block; font-size:13px; color:#46566a; margin-bottom:6px; }
    .item input {
        width:100%; padding:12px 14px; border:1px solid rgba(120,160,190,.4);
        border-radius:12px; font-size:14px; background:rgba(255,255,255,.75); outline:none;
    }
    .item input:focus { border-color:#2ec4b6; box-shadow:0 0 0 3px rgba(46,196,182,.18); }
    .row { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#46566a; margin:6px 0 16px; }
    .row a { color:#1676d6; cursor:pointer; }
    .login-btn {
        width:100%; padding:13px; border:none; border-radius:12px; cursor:pointer;
        background:linear-gradient(90deg,#1676d6,#2ec4b6); color:#fff; font-size:16px;
        transition:.25s;
    }
    .login-btn:hover { box-shadow:0 8px 20px rgba(22,118,214,.4); transform:translateY(-1px); }
    .tip { text-align:center; margin-top:16px; font-size:13px; color:#46566a; }
    .tip a { color:#1676d6; text-decoration:none; }
</style>
</head>
<body>
    <div class="sys-title">
        <h1>张店区15分钟生活圈</h1>
        <p>便民设施评价与管理系统 · WebGIS 空间分析平台</p>
    </div>
 
    <div class="login-card">
        <h2>用户登录</h2>
        <div class="item">
            <label>用户名</label>
            <input id="username" placeholder="请输入用户名">
        </div>
        <div class="item">
            <label>密码</label>
            <input id="password" type="password" placeholder="请输入密码">
        </div>
        <div class="row">
            <label><input type="checkbox" id="remember"> 记住账号</label>
            <a onclick="toast('请联系管理员重置密码')">忘记密码？</a>
        </div>
        <button class="login-btn" onclick="doLogin()">登 录</button>
        <div class="tip">还没有账号？<a href="register.html">立即注册</a></div>
    </div>
 
<script src="js/config.js"></script>
<script>
// 记住账号：回填上次用户名
window.onload = function () {
    const saved = localStorage.getItem('remember_user');
    if (saved) { document.getElementById('username').value = saved; document.getElementById('remember').checked = true; }
};
 
// 登录：调用后端 POST /api/user/login
async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username) { toast('请输入用户名'); return; }
    if (!password) { toast('请输入密码'); return; }
 
    try {
        // 后端返回 { token, user }
        const data = await api('/api/user/login', { method:'POST', body:{ username, password } });
        TokenStore.setToken(data.token);
        TokenStore.setUser(data.user);
        // 记住账号
        if (document.getElementById('remember').checked) localStorage.setItem('remember_user', username);
        else localStorage.removeItem('remember_user');
 
        toast('登录成功，欢迎 ' + data.user.username);
        setTimeout(() => { location.href = 'main.html'; }, 500);
    } catch (e) { /* api 已 toast 错误 */ }
}
// 回车登录
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
